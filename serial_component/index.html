<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:2px 3px 4px;font:14px 'DM Sans',system-ui,sans-serif;color:#183d36;-webkit-font-smoothing:antialiased}
.actions{display:flex;gap:8px}
button{height:44px;padding:0 18px;border:1px solid #1b4e40;border-radius:10px;background:#1b4e40;color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
button:not(:disabled):hover{background:#2b6753}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid #85b39a;outline-offset:2px}
#stop{background:#fff;color:#1b4e40;border-color:#cbd9ca}
#stop:not(:disabled):hover{background:#eef2e9}
.status-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px}
#status{font-size:13px;margin:0}
#readings{font-size:12px;color:#60746b;text-align:right}
canvas{display:block;width:100%;height:64px;margin-top:10px;border-radius:10px;
  background:linear-gradient(#cbd9ca,#cbd9ca) center/calc(100% - 28px) 1px no-repeat,#f6f8f5}
canvas.live{background:#f6f8f5}
.sound-row{display:flex;align-items:center;gap:10px;margin-top:12px}
#sound{flex-shrink:0;white-space:nowrap;height:auto;padding:5px 10px;background:transparent;color:#486554;border-color:#cbd9ca;border-radius:8px;font-size:11px;font-weight:400}
#sound:hover{background:#eef2e9}
small{font-size:10.5px;color:#60746b}
</style></head><body>
<div class="actions"><button id="connect" type="button">Connect Arduino</button><button id="stop" type="button" disabled>Disconnect</button></div>
<div class="status-row"><p id="status" role="status" aria-live="polite">Ready to connect.</p><span id="readings">Pulse + skin response</span></div>
<canvas id="wave" width="600" height="70" aria-label="Live raw pulse waveform" role="img"></canvas>
<div class="sound-row"><button id="sound" type="button" aria-pressed="false">Monitor sound: off</button><small>Connection cue · not your heartbeat</small></div>
<script src="serial.js"></script></body></html>
