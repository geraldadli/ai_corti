<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font:14px system-ui,sans-serif;color:#183d36}button{padding:12px 18px;border:1px solid #1b4e40;border-radius:10px;background:#1b4e40;color:white;font:inherit;cursor:pointer;margin:0 8px 12px 0}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #85b39a;outline-offset:2px}#stop{background:white;color:#1b4e40}p{font-size:13px;line-height:1.5;margin:6px 0}small{color:#60746b}canvas{display:block;width:100%;height:70px;margin-top:10px;background:#f6f8f5;border-radius:10px}
</style></head><body>
<button id="connect" type="button">Connect Arduino</button><button id="stop" type="button" disabled>Disconnect</button>
<p id="status" role="status" aria-live="polite">Ready to connect.</p>
<small id="readings">Pulse + skin response</small>
<canvas id="wave" width="600" height="70" aria-label="Live raw pulse waveform" role="img"></canvas>
<script src="serial.js"></script></body></html>
